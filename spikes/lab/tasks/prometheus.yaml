# prometheus CI (PR) → CInema tasks: the test_go / test_go_more / test_go_386 /
# golangci / check_generated_parser / test_ui / compliance work. Fuzzing (4 parallel
# 4-minute jobs, never reusable) and jobs that download floating tools stay in
# upstream's workflows: inside one gate job they'd only add serial time.
schema_version: 1
tasks:
  style:
    argv: [bash, -c, "r=$(gofmt -d $(git ls-files '*.go' ':!:vendor/*')); [ -z \"$r\" ] || { echo \"$r\"; exit 1; }"]
    platform: any
    toolchain: [{cmd: [go, version]}]
    reuse: { allowed: true, max_age: 72h }
  check-license:
    argv: [bash, -c, "r=$(for f in $(git ls-files '*.go' ':!:vendor/*'); do awk 'NR<=3' \"$f\" | grep -Eq '(Copyright|generated|GENERATED)' || echo \"$f\"; done); [ -z \"$r\" ] || { echo \"$r\"; exit 1; }"]
    platform: any
    toolchain: []
    reuse: { allowed: true, max_age: 72h }
  go-mod-tidy:
    argv: [bash, -o, pipefail, -c, "go mod tidy && git diff --exit-code -- go.sum go.mod"]
    platform: any
    toolchain: [{cmd: [go, version]}]
    reuse: { allowed: true, max_age: 72h }
  test-race:
    argv: [go, test, -race, -count=1, ./...]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [CGO_ENABLED, GOFLAGS, GOEXPERIMENT]
    reuse: { allowed: true, max_age: 72h }
  tsdb-no-isolation:
    argv: [go, test, -count=1, ./tsdb/, -test.tsdb-isolation=false]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [CGO_ENABLED, GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  dedupelabels:
    argv: [go, test, -count=1, -tags=dedupelabels, ./...]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [CGO_ENABLED, GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  slicelabels-race:
    argv: [go, test, -count=1, -tags=slicelabels, -race, ./cmd/prometheus, ./cmd/promtool/..., ./model/textparse, ./prompb/...]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [CGO_ENABLED, GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  forcedirectio-race:
    argv: [go, test, -count=1, -tags=forcedirectio, -race, ./tsdb/]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [CGO_ENABLED, GOFLAGS, TMPDIR]
    reuse: { allowed: true, max_age: 72h }
  test-386:
    argv: [env, GOARCH=386, go, test, -count=1, -parallel=1, ./...]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  golangci-lint:
    argv: [bash, -o, pipefail, -c, "set -e; v=2.14.0; d=$HOME/.cache/cinema-lab-tools/golangci-lint-$v; if [ ! -x $d/golangci-lint ]; then mkdir -p $d; t=$(mktemp); curl -sSfL -o $t https://github.com/golangci/golangci-lint/releases/download/v$v/golangci-lint-$v-linux-amd64.tar.gz; echo \"ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  $t\" | sha256sum -c --quiet; tar -xzf $t -C $d --strip-components=1; rm -f $t; fi; GOLANGCI_LINT_CACHE=$d/cache $d/golangci-lint run"]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  golangci-lint.slicelabels:
    argv: [bash, -o, pipefail, -c, "set -e; v=2.14.0; d=$HOME/.cache/cinema-lab-tools/golangci-lint-$v; if [ ! -x $d/golangci-lint ]; then mkdir -p $d; t=$(mktemp); curl -sSfL -o $t https://github.com/golangci/golangci-lint/releases/download/v$v/golangci-lint-$v-linux-amd64.tar.gz; echo \"ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  $t\" | sha256sum -c --quiet; tar -xzf $t -C $d --strip-components=1; rm -f $t; fi; GOLANGCI_LINT_CACHE=$d/cache $d/golangci-lint run --build-tags=slicelabels"]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  golangci-lint.dedupelabels:
    argv: [bash, -o, pipefail, -c, "set -e; v=2.14.0; d=$HOME/.cache/cinema-lab-tools/golangci-lint-$v; if [ ! -x $d/golangci-lint ]; then mkdir -p $d; t=$(mktemp); curl -sSfL -o $t https://github.com/golangci/golangci-lint/releases/download/v$v/golangci-lint-$v-linux-amd64.tar.gz; echo \"ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  $t\" | sha256sum -c --quiet; tar -xzf $t -C $d --strip-components=1; rm -f $t; fi; GOLANGCI_LINT_CACHE=$d/cache $d/golangci-lint run --build-tags=dedupelabels"]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  generated-parser:
    argv: [bash, -o, pipefail, -c, "set -e; d=$(mktemp -d); GOBIN=$d go install golang.org/x/tools/cmd/goyacc@v0.6.0; $d/goyacc -l -o promql/parser/generated_parser.y.go promql/parser/generated_parser.y; rm -rf $d; git diff --exit-code -- promql/parser/generated_parser.y.go"]
    platform: any
    toolchain: [{cmd: [go, version]}]
    reuse: { allowed: true, max_age: 72h }
  examples-syntax:
    argv: [bash, -o, pipefail, -c, "set -e; d=$(mktemp -d); go build -o $d/promtool ./cmd/promtool; cd documentation/examples; for f in prometheus-*.yml; do $d/promtool check config --syntax-only $f; done; rm -rf $d"]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    reuse: { allowed: true, max_age: 72h }
  compliance:
    argv: [go, test, -count=1, -tags=compliance, ./compliance/...]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}]
    env: [CGO_ENABLED, GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  ui:
    argv: [env, CI=true, bash, -o, pipefail, -c, "make assets-tarball && make ui-lint && make ui-test"]
    platform: linux/amd64
    outputs: [.tarballs]
    toolchain: [{cmd: [go, version]}, {cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
  # build job ("Build Prometheus for common architectures", 3 shards upstream): promu
  # crossbuild of 6 platforms inside golang-builder. The image is pulled by a floating
  # tag, so it's fingerprinted by its resolved digest (image: entry). UI assets are
  # built first (upstream restores them from the UI job's artifact).
  crossbuild:
    argv: [bash, -o, pipefail, -c, "export CI=true; make promu && make assets && $(go env GOPATH)/bin/promu crossbuild -v --parallelism 6 -p linux/amd64 -p windows/amd64 -p linux/arm64 -p darwin/amd64 -p darwin/arm64 -p linux/386"]
    platform: linux/amd64
    toolchain: [{cmd: [go, version]}, {cmd: [node, --version]}, {image: quay.io/prometheus/golang-builder:1.27-base}]
    env: [GOFLAGS]
    exclusive: true                 # saturates every core for ~13 min: timing-sensitive tsdb/promql tests fail beside it (finding 33)
    reuse: { allowed: true, max_age: 72h }
