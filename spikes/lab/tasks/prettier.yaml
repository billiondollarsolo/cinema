# prettier CI (PR, ubuntu) → CInema tasks, one per upstream job and Node version.
# Each pins its Node with runtime: (provisioned identically on the evidence machine
# and in the gate) and runs prettier's vendored yarn release directly: Node 25+
# no longer bundles corepack. Tasks install their own dependencies (clean checkout).
# Node 14/16/18 prod cells rewrite the lockfile, and the Node 20 cell builds dist with
# Node 22 but tests it with 20 (two runtimes in one job), so none of those are tasks.
# Tests pin --maxWorkers=3, as on a 4-vCPU runner: with jest's default (cores - 1 = 15 on
# the 16-core lab box) jest-light-runner/child-process deadlocks; with 3 it passes in 84 s.
schema_version: 1
tasks:
  # lint.yml Lint (Node 24): every step except actionlint (fetched from main),
  # Dependency Review (GitHub API) and renovate@latest, which depend on floating state.
  lint:
    argv:
      [
        bash,
        -o,
        pipefail,
        -c,
        "Y=$(ls $PWD/.yarn/releases/yarn-*.cjs) && node $Y install --immutable && for s in lint:deps lint:typecheck lint:eslint lint:prettier lint:spellcheck lint:changelog lint:format-test; do node $Y run $s; done && PRETTIER_DEBUG=true node $Y prettier '{docs,website/versioned_docs/version-stable}/**/*.md' --check && for d in . website scripts/release scripts/tools/bundle-test scripts/tools/eslint-plugin-prettier-internal-rules; do (cd $d && node $Y install && node $Y dedupe --check) || exit 1; done && node $Y run lint:knip && node ./scripts/ensure-no-files-changed.js",
      ]
    platform: linux/amd64
    runtime: { node: 24.22.1 }
    toolchain: [{ cmd: [node, --version] }]
    reuse: { allowed: true, max_age: 72h }
  # dev-test.yml Node 22
  dev-test-22:
    argv:
      [
        bash,
        -o,
        pipefail,
        -c,
        "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y test --maxWorkers=3",
      ]
    platform: linux/amd64
    runtime: { node: 22.23.4 }
    toolchain: [{ cmd: [node, --version] }]
    reuse: { allowed: true, max_age: 72h }
  # dev-test.yml Node 26 (FULL_TEST, coverage)
  dev-test-26-full:
    argv:
      [
        bash,
        -o,
        pipefail,
        -c,
        "export FULL_TEST=true ENABLE_CODE_COVERAGE=true; Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y c8 node $Y test --maxWorkers=3",
      ]
    platform: linux/amd64
    runtime: { node: 26.12.1 }
    toolchain: [{ cmd: [node, --version] }]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Test (Node 26, FULL_TEST)
  prod-test-26:
    argv:
      [
        bash,
        -o,
        pipefail,
        -c,
        "export FULL_TEST=true; Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production --maxWorkers=3 && node $Y test:production-standalone --maxWorkers=3",
      ]
    platform: linux/amd64
    runtime: { node: 26.12.1 }
    toolchain: [{ cmd: [node, --version] }]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Test (Node 24)
  prod-test-24:
    argv:
      [
        bash,
        -o,
        pipefail,
        -c,
        "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production --maxWorkers=3 && node $Y test:production-standalone --maxWorkers=3",
      ]
    platform: linux/amd64
    runtime: { node: 24.22.1 }
    toolchain: [{ cmd: [node, --version] }]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Test (Node 22)
  prod-test-22:
    argv:
      [
        bash,
        -o,
        pipefail,
        -c,
        "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production --maxWorkers=3 && node $Y test:production-standalone --maxWorkers=3",
      ]
    platform: linux/amd64
    runtime: { node: 22.23.4 }
    toolchain: [{ cmd: [node, --version] }]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Lint (runner-default Node 22)
  prod-lint:
    argv:
      [
        bash,
        -o,
        pipefail,
        -c,
        "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production-lint",
      ]
    platform: linux/amd64
    runtime: { node: 22.23.4 }
    toolchain: [{ cmd: [node, --version] }]
    reuse: { allowed: true, max_age: 72h }
