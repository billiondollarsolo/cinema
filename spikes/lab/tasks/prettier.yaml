# prettier CI (PR, ubuntu) → CInema tasks, one per upstream job and Node version.
# Each pins its Node with runtime: (provisioned identically on the evidence machine
# and in the gate) and runs prettier's vendored yarn release directly: Node 25+
# no longer bundles corepack. Tasks install their own dependencies (clean checkout).
# Node 14/16/18 prod cells rewrite the lockfile, so they aren't tasks.
schema_version: 1
tasks:
  # lint.yml Lint (Node 24)
  lint:
    argv: [bash, -o, pipefail, -c, "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && for s in lint:deps lint:typecheck lint:eslint lint:prettier lint:spellcheck lint:changelog lint:format-test lint:knip; do node $Y run $s; done && PRETTIER_DEBUG=true node $Y prettier '{docs,website/versioned_docs/version-stable}/**/*.md' --check"]
    platform: linux/amd64
    runtime: { node: 24.22.1 }
    toolchain: [{cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
  # dev-test.yml Node 22
  dev-test-22:
    argv: [bash, -o, pipefail, -c, "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y test"]
    platform: linux/amd64
    runtime: { node: 22.23.4 }
    toolchain: [{cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
  # dev-test.yml Node 26 (FULL_TEST, coverage)
  dev-test-26-full:
    argv: [bash, -o, pipefail, -c, "export FULL_TEST=true ENABLE_CODE_COVERAGE=true; Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y c8 node $Y test"]
    platform: linux/amd64
    runtime: { node: 26.12.1 }
    toolchain: [{cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Test (Node 26, FULL_TEST)
  prod-test-26:
    argv: [bash, -o, pipefail, -c, "export FULL_TEST=true; Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production && node $Y test:production-standalone"]
    platform: linux/amd64
    runtime: { node: 26.12.1 }
    toolchain: [{cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Test (Node 24)
  prod-test-24:
    argv: [bash, -o, pipefail, -c, "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production && node $Y test:production-standalone"]
    platform: linux/amd64
    runtime: { node: 24.22.1 }
    toolchain: [{cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Test (Node 22)
  prod-test-22:
    argv: [bash, -o, pipefail, -c, "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production && node $Y test:production-standalone"]
    platform: linux/amd64
    runtime: { node: 22.23.4 }
    toolchain: [{cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Test (Node 20)
  prod-test-20:
    argv: [bash, -o, pipefail, -c, "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production && node $Y test:production-standalone"]
    platform: linux/amd64
    runtime: { node: 20.20.2 }
    toolchain: [{cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
  # prod-test.yml Lint (runner-default Node 22)
  prod-lint:
    argv: [bash, -o, pipefail, -c, "Y=$(ls .yarn/releases/yarn-*.cjs) && node $Y install --immutable && node $Y build --clean && node $Y test:production-lint"]
    platform: linux/amd64
    runtime: { node: 22.23.4 }
    toolchain: [{cmd: [node, --version]}]
    reuse: { allowed: true, max_age: 72h }
