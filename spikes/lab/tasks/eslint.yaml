# Note: a YAML comment starting with the linter's name is read by eslint as an inline
# config directive (lab finding), so this header avoids that.
# CInema tasks for the eslint CI (PR, ubuntu), one per upstream job and Node version, Node
# pinned with runtime:. eslint has NO lockfile: npm install floats within semver
# ranges, and resolved versions are only known after install, so they can't be
# fingerprinted before a run. Evidence is bound to the source and Node version only;
# max_age is short (24h) to bound the window in which a new dependency release could
# change the result. A project without a lockfile can't get exact reuse.
schema_version: 1
tasks:
    # ci.yml Verify Files
    verify-files:
        argv:
            [
                bash,
                -o,
                pipefail,
                -c,
                "npm install --no-audit --no-fund && (cd docs && npm install --no-audit --no-fund) && node Makefile lint && node Makefile checkRuleFiles && node Makefile checkLicenses && node Makefile lintDocsJS && node Makefile checkRuleExamples && npm run lint:rule-types && npm run lint:unused && npm run fmt:check",
            ]
        platform: linux/amd64
        runtime: { node: 24.22.1 }
        toolchain: [{ cmd: [node, --version] }]
        reuse: { allowed: true, max_age: 24h }
    # ci.yml Test (Node 26.x)
    mocha-26:
        argv:
            [
                bash,
                -o,
                pipefail,
                -c,
                "npm install --no-audit --no-fund && node Makefile mocha",
            ]
        platform: linux/amd64
        runtime: { node: 26.12.1 }
        toolchain: [{ cmd: [node, --version] }]
        reuse: { allowed: true, max_age: 24h }
    # ci.yml Test (Node 24.x)
    mocha-24:
        argv:
            [
                bash,
                -o,
                pipefail,
                -c,
                "npm install --no-audit --no-fund && node Makefile mocha",
            ]
        platform: linux/amd64
        runtime: { node: 24.22.1 }
        toolchain: [{ cmd: [node, --version] }]
        reuse: { allowed: true, max_age: 24h }
    # ci.yml Test (Node 22.x)
    mocha-22:
        argv:
            [
                bash,
                -o,
                pipefail,
                -c,
                "npm install --no-audit --no-fund && node Makefile mocha",
            ]
        platform: linux/amd64
        runtime: { node: 22.23.4 }
        toolchain: [{ cmd: [node, --version] }]
        reuse: { allowed: true, max_age: 24h }
    # ci.yml Test (Node 20.x)
    mocha-20:
        argv:
            [
                bash,
                -o,
                pipefail,
                -c,
                "npm install --no-audit --no-fund && node Makefile mocha",
            ]
        platform: linux/amd64
        runtime: { node: 20.20.2 }
        toolchain: [{ cmd: [node, --version] }]
        reuse: { allowed: true, max_age: 24h }
    # ci.yml Test Types (the @latest TS 7 step floats, so it isn't included)
    types:
        argv:
            [
                bash,
                -o,
                pipefail,
                -c,
                "npm install --no-audit --no-fund && npx tsc -p tests/lib/types/tsconfig.json && npm run test:types -w packages/eslint-config-eslint && npm run test:types -w packages/js && npm run test:types:5.3 && npm run test:types:5.x",
            ]
        platform: linux/amd64
        runtime: { node: 24.22.1 }
        toolchain: [{ cmd: [node, --version] }]
        reuse: { allowed: true, max_age: 24h }
