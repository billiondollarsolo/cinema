# traefik CI (PR, ubuntu) → CInema tasks. Go pinned with runtime: {go: 1.26.10}, provisioned
# identically on the evidence machine and in the gate (no check-latest drift);
# yarn's version is pinned by webui/package.json (in the source fingerprint), so it isn't probed.
schema_version: 1
tasks:
  test-unit:                      # test-unit.yaml
    argv: [go, test, -count=1, -parallel, "8", ./cmd/..., ./pkg/...]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}, {file: go.sum}]
    env: [CGO_ENABLED, GOFLAGS, GOEXPERIMENT]
    reuse: { allowed: true, max_age: 72h }
  lint:                           # validate.yaml lint (golangci-lint v2.13.2)
    argv: [bash, -o, pipefail, -c, "set -e; v=2.13.2; d=$HOME/.cache/cinema-lab-tools/golangci-lint-$v; if [ ! -x $d/golangci-lint ]; then mkdir -p $d; t=$(mktemp); curl -sSfL -o $t https://github.com/golangci/golangci-lint/releases/download/v$v/golangci-lint-$v-linux-amd64.tar.gz; echo \"2277d43b98ec0054280f2ac26b53268bae97682444678a59a657dd565da021d6  $t\" | sha256sum -c --quiet; tar -xzf $t -C $d --strip-components=1; rm -f $t; fi; GOLANGCI_LINT_CACHE=$d/cache $d/golangci-lint run"]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}, {file: .golangci.yml}, {file: go.sum}]
    env: [GOFLAGS, CGO_ENABLED]
    reuse: { allowed: true, max_age: 72h }
  validate-vendor:                # validate.yaml validate (part)
    argv: [./script/validate-vendor.sh]
    platform: any
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  validate-generate:              # validate.yaml validate-generate (part)
    argv: [bash, -o, pipefail, -c, "go generate && git diff --exit-code"]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  build-linux-amd64:              # build.yaml build (linux/amd64 leg)
    argv: [env, CGO_ENABLED=0, GOOS=linux, GOARCH=amd64, go, build, -ldflags, "-s -w", -installsuffix, nocgo, -o, /dev/null, ./cmd/traefik]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  build-cross-1:                  # build.yaml build (other 18 legs, 3 per task so the no-evidence gate fans out like upstream's matrix)
    argv: [bash, -o, pipefail, -c, "set -e; for t in darwin/amd64/ darwin/arm64/ freebsd/amd64/; do IFS=/ read -r os arch arm <<< \"$t\"; CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -ldflags '-s -w' -installsuffix nocgo -o /dev/null ./cmd/traefik; done"]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  build-cross-2:
    argv: [bash, -o, pipefail, -c, "set -e; for t in freebsd/arm64/ linux/arm64/ openbsd/amd64/; do IFS=/ read -r os arch arm <<< \"$t\"; CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -ldflags '-s -w' -installsuffix nocgo -o /dev/null ./cmd/traefik; done"]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  build-cross-3:
    argv: [bash, -o, pipefail, -c, "set -e; for t in openbsd/arm64/ windows/amd64/ windows/arm64/; do IFS=/ read -r os arch arm <<< \"$t\"; CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -ldflags '-s -w' -installsuffix nocgo -o /dev/null ./cmd/traefik; done"]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  build-cross-4:
    argv: [bash, -o, pipefail, -c, "set -e; for t in freebsd/386/ linux/386/ linux/arm/6; do IFS=/ read -r os arch arm <<< \"$t\"; CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -ldflags '-s -w' -installsuffix nocgo -o /dev/null ./cmd/traefik; done"]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  build-cross-5:
    argv: [bash, -o, pipefail, -c, "set -e; for t in linux/arm/7 linux/ppc64le/ linux/riscv64/; do IFS=/ read -r os arch arm <<< \"$t\"; CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -ldflags '-s -w' -installsuffix nocgo -o /dev/null ./cmd/traefik; done"]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  build-cross-6:
    argv: [bash, -o, pipefail, -c, "set -e; for t in linux/s390x/ openbsd/386/ windows/386/; do IFS=/ read -r os arch arm <<< \"$t\"; CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm go build -ldflags '-s -w' -installsuffix nocgo -o /dev/null ./cmd/traefik; done"]
    platform: linux/amd64
    timeout: 45m
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 72h }
  webui-build:                    # build.yaml build-webui
    argv: [bash, -o, pipefail, -c, "yarn install --immutable && yarn tsc && yarn lint && yarn build"]
    cwd: webui
    platform: linux/amd64
    timeout: 45m
    outputs: [webui/static]       # vite emptyOutDir deletes a tracked file there (lab finding)
    toolchain: [{cmd: [node, --version]}]
    env: [NODE_OPTIONS]
    reuse: { allowed: true, max_age: 72h }
  webui-test-unit:                # test-unit.yaml test-ui-unit
    argv: [bash, -o, pipefail, -c, "yarn install --immutable && VITE_APP_BASE_API_URL=/api yarn test:unit:ci"]
    cwd: webui
    platform: linux/amd64
    timeout: 45m
    toolchain: [{cmd: [node, --version]}]
    env: [NODE_OPTIONS, TZ]
    reuse: { allowed: true, max_age: 72h }
  # test-integration.yaml (12 shards upstream) as 5 suite groups. They share a fixed
  # docker network and ports, so they run exclusively under -j. Images are pulled
  # by tag at test time and not fingerprinted (finding 18), hence max_age: 24h;
  # docker itself isn't probed (dev box and runner versions differ).
  integration-k8s:
    argv: [bash, -o, pipefail, -c, "export CGO_ENABLED=0; touch webui/static/index.html && make binary-linux-amd64 && go test ./integration -count=1 -test.timeout=60m -run '^(TestK8sSuite|TestGatewayAPISuite)$'"]
    platform: linux/amd64
    timeout: 45m
    exclusive: true
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 24h }
  integration-kv:
    argv: [bash, -o, pipefail, -c, "export CGO_ENABLED=0; touch webui/static/index.html && make binary-linux-amd64 && go test ./integration -count=1 -test.timeout=60m -run '^(TestConsulSuite|TestConsulCatalogSuite|TestEtcdSuite|TestRedisSuite|TestRedisSentinelSuite|TestZookeeperSuite)$'"]
    platform: linux/amd64
    timeout: 45m
    exclusive: true
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 24h }
  integration-docker:
    argv: [bash, -o, pipefail, -c, "export CGO_ENABLED=0; touch webui/static/index.html && make binary-linux-amd64 && go test ./integration -count=1 -test.timeout=60m -run '^(TestDockerSuite|TestDockerComposeSuite|TestTracingSuite|TestAcmeSuite)$'"]
    platform: linux/amd64
    timeout: 45m
    exclusive: true
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 24h }
  integration-core-a:
    argv: [bash, -o, pipefail, -c, "export CGO_ENABLED=0; touch webui/static/index.html && make binary-linux-amd64 && go test ./integration -count=1 -test.timeout=60m -run '^(TestAccessLogSuite|TestDualLoggingSuite|TestErrorPagesSuite|TestFileSuite|TestGRPCSuite|TestHeadersSuite|TestHealthCheckSuite|TestHostResolverSuite|TestHTTPSSuite|TestHTTPSuite|TestKeepAliveSuite|TestLogRotationSuite)$'"]
    platform: linux/amd64
    timeout: 45m
    exclusive: true
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 24h }
  integration-core-b:
    argv: [bash, -o, pipefail, -c, "export CGO_ENABLED=0; touch webui/static/index.html && make binary-linux-amd64 && go test ./integration -count=1 -test.timeout=60m -run '^(TestProxyProtocolSuite|TestRateLimitSuite|TestRestSuite|TestRetrySuite|TestRoutingSuite|TestSimpleSuite|TestTCPHealthCheckSuite|TestTCPSuite|TestThrottlingSuite|TestTimeoutSuite|TestTLSClientHeadersSuite|TestUDPSuite|TestWebsocketSuite)$'"]
    platform: linux/amd64
    timeout: 45m
    exclusive: true
    runtime: { go: 1.26.10 }
    toolchain: [{cmd: [go, version]}]
    env: [GOFLAGS]
    reuse: { allowed: true, max_age: 24h }
